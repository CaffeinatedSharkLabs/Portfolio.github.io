<script>
function dl(scale){
  var status=document.getElementById('status'); status.textContent='Rendering…';
  var svg=document.querySelector('#poster svg').cloneNode(true);
  var W=1000*scale, H=1500*scale;
  svg.setAttribute('width',W); svg.setAttribute('height',H);
  var xml=new XMLSerializer().serializeToString(svg);
  var url=URL.createObjectURL(new Blob([xml],{type:'image/svg+xml;charset=utf-8'}));
  var img=new Image();
  img.onload=function(){
    var c=document.createElement('canvas'); c.width=W; c.height=H;
    c.getContext('2d').drawImage(img,0,0,W,H); URL.revokeObjectURL(url);
    var a=document.createElement('a'); a.download='The Vanishing of .NET MAUI - Poster'+(scale>1?' @'+scale+'x':'')+'.png'; a.href=c.toDataURL('image/png');
    document.body.appendChild(a); a.click(); a.remove(); status.textContent='Downloaded ✓ ('+W+' × '+H+')';
  };
  img.onerror=function(){ status.textContent='Render failed — try the other size.'; };
  img.src=url;
}
</script>
